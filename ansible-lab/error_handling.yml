---
- name: Demonstrate Error Handling
  hosts: webservers
  become: true

  tasks:
    - name: Run command that will fail
      command: /bin/false
      ignore_errors: yes

    - name: Continue after error
      debug:
        msg: "Playbook continued after the error"

    - name: Custom failure condition
      command: /bin/true
      register: command_result
      failed_when: command_result.rc != 0
      changed_when: false

