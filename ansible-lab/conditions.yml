---
- name: Demonstrate Conditions
  hosts: webservers
  become: true

  tasks:
    - name: Show OS family
      debug:
        msg: "OS family is {{ ansible_facts['os_family'] }}"

    - name: Install Apache on Debian family
      apt:
        name: apache2
        state: present
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Install Apache on RedHat family
      yum:
        name: httpd
        state: present
      when: ansible_facts['os_family'] == "RedHat"

    - name: Show message for non-RedHat systems
      debug:
        msg: "This system is not RedHat"
      when: ansible_facts['os_family'] != "RedHat"

    - name: Check supported OS family
      debug:
        msg: "This OS family is supported"
      when: ansible_facts['os_family'] in ["Debian", "RedHat"]

    - name: Check unsupported OS family
      debug:
        msg: "This OS family is outside the unsupported list"
      when: ansible_facts['os_family'] not in ["Solaris", "AIX"]

    - name: Show package name with ternary
      debug:
        msg: "{{ (ansible_facts['os_family'] == 'Debian') | ternary('apache2', 'httpd') }}"