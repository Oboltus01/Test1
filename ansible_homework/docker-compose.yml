services:
  node1:
    image: geerlingguy/docker-ubuntu2004-ansible:latest
    container_name: node1
    hostname: node1
    privileged: true
    cgroup: host
    ports:
      - "8081:80"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/docker

  node2:
    image: geerlingguy/docker-ubuntu2004-ansible:latest
    container_name: node2
    hostname: node2
    privileged: true
    cgroup: host
    ports:
      - "8082:80"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/docker