---
- name: Deploy Dynamic Web Server
  hosts: webservers
  become: true
  gather_facts: true

  tasks:
    - name: Ensure Nginx is installed
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Deploy dynamic index page
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: "{{ app_dir }}/index.html"
        owner: root
        group: root
        mode: "0644"

    - name: Deploy dynamic Nginx configuration
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/default
        owner: root
        group: root
        mode: "0644"
        backup: true
      notify: Restart Nginx

    - name: Validate Nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Ensure Nginx is started and enabled
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Run pending handlers before verification
      ansible.builtin.meta: flush_handlers

    - name: Verify home page
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ http_port }}/"
        status_code: 200
        return_content: true
      register: homepage_result
      changed_when: false

    - name: Verify health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ http_port }}/health"
        status_code: 200
        return_content: true
      register: health_result
      changed_when: false

    - name: Validate returned content
      ansible.builtin.assert:
        that:
          - site_title in homepage_result.content
          - environment_name in homepage_result.content
          - "'healthy' in health_result.content"
        success_msg: "HTTP verification passed for {{ inventory_hostname }}"
        fail_msg: "HTTP verification failed for {{ inventory_hostname }}"

  handlers:
    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted