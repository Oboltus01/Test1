---
- name: Select OS-specific webserver service
  ansible.builtin.set_fact:
    webserver_service_name: >-
      {{ 'apache2' if ansible_facts['os_family'] == 'Debian' else 'httpd' }}

- name: Install required packages with fault handling
  block:
    - name: Update Debian package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Update RedHat package cache
      ansible.builtin.dnf:
        update_cache: true
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Install application packages
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop: "{{ [webserver_service_name] + application_packages }}"

  rescue:
    - name: Report package installation failure safely
      ansible.builtin.debug:
        msg: "Package installation failed on {{ inventory_hostname }}; host skipped."

    - name: Stop processing failed host
      ansible.builtin.meta: end_host

- name: Ensure document root exists
  ansible.builtin.file:
    path: "{{ webserver_doc_root }}"
    state: directory
    mode: "0755"

- name: Deploy application page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ webserver_doc_root }}/index.html"
    mode: "0644"
  notify: Restart webserver

- name: Store encrypted application credentials
  ansible.builtin.copy:
    content: |
      db_password={{ db_password }}
    dest: /etc/corporate-application.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Ensure webserver is started and enabled
  ansible.builtin.service:
    name: "{{ webserver_service_name }}"
    state: started
    enabled: true
