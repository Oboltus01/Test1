---
- name: Deploy encrypted database credentials
  hosts: database
  become: true

  tasks:
    - name: Deploy protected database configuration
      ansible.builtin.copy:
        content: |
          DB_USER={{ vault_db_user }}
          DB_PASSWORD={{ vault_db_pass }}
        dest: /etc/db_app.conf
        owner: root
        group: root
        mode: "0600"
      no_log: true
