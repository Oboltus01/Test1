apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  containers:
  - name: nginx
    image: nginx:1.25
    ports:
    - containerPort: 80
    resources:
      requests:
        memory: "6Mi"
        cpu: "250m"
      limits:
        memory: "32Mi"
        cpu: "500m"
    readinessProbe:
      httpGet:
        path: /
        port: 80
      periodSeconds: 1
    livenessProbe:
      httpGet:
        path: /
        port: 80
      periodSeconds: 1