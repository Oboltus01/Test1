
apiVersion: batch/v1
kind: Job
metadata:
  name: notagoodjob
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: notagoodjob
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "launched at $(date)"
              sleep 5
              exit 1
