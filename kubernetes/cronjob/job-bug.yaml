apiVersion: batch/v1
kind: Job
metadata:
  name: jobimbug
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: jobimbug
          image: busybox
          command: ["sh", "-c", "echo trying at $(date)...; sleep 5; exit 42"]
  podFailurePolicy:
    rules:
      - action: FailJob
        onExitCodes:
          containerName: jobimbug
          operator: In
          values: [42]
